[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-libero"
version = "0.1.1.post1"
description = "LIBERO: Benchmark and environments for robot learning"
authors = [
    { name = "Jade Choghari", email = "jade.choghari@huggingface.co" },
]
maintainers = [
    { name = "Chaoqi Liu", email = "liuchaoqi730@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    # egl probe: canonical repo
    "hf-egl-probe>=1.0.2",

    # core runtime / reproducible pins
    "hydra-core>=1.2,<1.4",
    "praxis-robomimic==0.5.0",
    "praxis-robosuite>=1.5.2,<1.6",
    "bddl==1.0.1",
    "huggingface_hub>=0.20.0",

    # common libs
    "numpy",
    "transformers",
    "easydict",
    "einops",
    "thop",
    "matplotlib>=3.5.3",
    "cloudpickle>=2.0.0",
    "opencv-python",
    "wandb",

    # gym: compatible range
    "gymnasium >= 0.29.0",
    "mujoco>=3.0.0",
    "future>=0.18.2",
]

[project.urls]
Homepage = "https://github.com/Chaoqi-LIU/lerobot-libero"
Repository = "https://github.com/Chaoqi-LIU/lerobot-libero"
Issues = "https://github.com/Chaoqi-LIU/lerobot-libero/issues"
"Maintainer Website" = "https://chaoqi-liu.com"

[project.scripts]
"lifelong.main" = "libero.lifelong.main:main"
"lifelong.eval" = "libero.lifelong.evaluate:main"
"libero.config_copy" = "scripts.config_copy:main"
"libero.create_template" = "scripts.create_template:main"
